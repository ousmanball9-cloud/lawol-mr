# =============================================================================
# NE PAS APPLIQUER CE BLUEPRINT — RISQUE DE DOUBLON DE SERVICE RENDER.
# =============================================================================
#
# Le service de production `lawol-api` EXISTE DEJA. Il a ete cree par
# scripts/deploy-render.ps1 (API Render), pas par ce fichier :
#
#   id        : srv-dbr2mglbedkc738p2nb0
#   nom       : lawol-api
#   workspace : Lawol
#   plan      : free
#   region    : frankfurt
#   URL       : https://lawol-api.onrender.com
#
# Appliquer ce blueprint depuis le dashboard (New > Blueprint) creerait un
# SECOND service portant le meme nom `lawol-api`, avec deux consequences :
#
#   1. Deux services sur les 750 h/mois partagees du plan free, soit ~375 h
#      chacun : mises en veille et coupures de service accrues sur la prod.
#   2. Le `healthCheckPath: /health` declare ici pointerait sur le nouveau
#      venu, pas sur l'instance qui sert reellement le front Vercel.
#
# Ce fichier est conserve UNIQUEMENT comme reference declarative de la
# configuration attendue (runtime Docker, region, health check, variables).
# La source de verite est scripts/deploy-render.ps1 + le dashboard Render.
#
# Blueprint applique par erreur ? Ne pas improviser :
# docs/migration-render-2026-11-12.md, section 8.
#
# -----------------------------------------------------------------------------
# Reference declarative : le deploiement automatise passe par scripts/deploy-render.ps1,
# qui cree le service, pousse les variables depuis .env et lance le build.
# Les valeurs `sync: false` ne sont JAMAIS dans le depot : elles sont saisies
# dans le dashboard Render (ou poussees par le script).

services:
  - type: web
    name: lawol-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: /app
      - key: PYTHONUTF8
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
